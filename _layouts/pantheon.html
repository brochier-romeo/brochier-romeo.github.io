<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta name="theme-color" content="#34271b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=IM+Fell+English:ital@0;1&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
</head>
<body class="pantheon-page">
  <a class="skip-link" href="#main">Skip to navigation</a>
  <main id="main" class="pantheon">
    {{ content }}
  </main>
  <div class="atmosphere-grain" aria-hidden="true"></div>
  <canvas id="birds-canvas" aria-hidden="true"></canvas>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
