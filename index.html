---
layout: pantheon
title: The Pantheon
description: A living collection of things worth keeping, stories worth retelling, and curiosities from every corner.
---

<section class="pantheon-stage" aria-label="The Pantheon">
  <div class="pantheon-frame">
    <img class="architecture-image" src="{{ '/assets/images/pantheon.webp' | relative_url }}" alt="The Caryatid Porch of the Erechtheion on the Acropolis in Athens" decoding="async">

    <nav class="inscription-nav" aria-label="Explore the collection">
      <a class="t-recipes" href="{{ '/recipes/' | relative_url }}">Recipes</a>
      <a class="t-social" href="{{ '/social/' | relative_url }}">Social</a>
      <a class="t-blog" href="{{ '/mini-blog/' | relative_url }}">Mini Blog</a>
      <a class="t-boards" href="{{ '/message-boards/' | relative_url }}">Message Boards</a>
      <a class="t-relics" href="{{ '/relics/' | relative_url }}">Relics</a>
    </nav>
  </div>

  <div class="loose-relics" aria-label="Loose relics">
    <div class="ticker-track">
      <div class="ticker-group">
        {% for relic in site.data.loose_relics %}
          <a class="ticker-item" href="{{ relic.url | relative_url }}" {% if relic.external %}target="_blank" rel="noopener noreferrer"{% endif %}>
            <span class="ticker-dot dot-{{ relic.category | slugify }}" aria-hidden="true"></span>
            <span>{{ relic.title | escape }}</span>
          </a>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
